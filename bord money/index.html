<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背板施工報價單</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --card-border: #2a2a35;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --accent-gold: #d4af37;
      --accent-green: #10b981;
      --input-bg: #16161a;
      --input-border: #334155;
      --input-focus: #60a5fa;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 { font-size: 1.3rem; color: #ffffff; text-align: center; margin-top: 0; letter-spacing: 1px; }
    h2 { font-size: 1.05rem; color: var(--accent-gold); border-bottom: 1px solid var(--card-border); padding-bottom: 8px; margin-top: 0; letter-spacing: 0.5px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    select:focus, input:focus {
      border-color: var(--input-focus);
    }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    .travel-notice {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      display: none;
    }
    .notice-free { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .notice-charge { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 10px; }
    th, td { padding: 10px 4px; text-align: left; border-bottom: 1px solid #2d3748; }
    th { color: var(--text-muted); font-weight: 600; }
    td { color: var(--text-main); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    .total-box {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
    }
    .total-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; color: var(--text-muted); }
    .grand-total { font-size: 1.25rem; font-weight: bold; color: var(--accent-green); margin-top: 8px; border-top: 1px solid rgba(16, 185, 129, 0.2); padding-top: 8px; }

    .btn {
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
    .btn-secondary { background: #2d3748; color: #cbd5e1; border: 1px solid #475569; }
    .btn-danger { background: #991b1b; color: white; }

    .install-btn { display: none; margin-bottom: 15px; }

    /* Modal 深色彈窗樣式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e1e24;
      border: 1px solid var(--card-border);
      width: 95%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .pwd-card {
      max-width: 360px;
      text-align: center;
    }
    .admin-table { font-size: 0.8rem; }
    .admin-table th, .admin-table td { padding: 6px 2px; }
    .admin-table input {
      padding: 5px 4px;
      font-size: 0.82rem;
      background: #16161a;
      border: 1px solid #334155;
      color: #fff;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <button id="installApp" class="btn btn-primary install-btn">📲 安裝報價 App 至主畫面</button>

  <div class="card">
    <h1>✨ 背板施工報價單</h1>
    
    <div class="form-group">
      <label>客戶類別 (Tier)</label>
      <select id="tier" onchange="calculate()">
        <option value="cash">1. 現金牌價</option>
        <option value="m5k">2. 會員（五千牌價）</option>
        <option value="m30k_1">3. 會員（三萬牌價 - A）</option>
        <option value="m30k_2">4. 會員（三萬牌價 - B）</option>
        <option value="m100k">5. 會員（十萬牌價）</option>
      </select>
    </div>

    <div class="form-group">
      <label>施工地點 / 地址區劃（自動判斷差旅費）</label>
      <input type="text" id="address" placeholder="例如：新北市三重區重新路 / 桃園市中壢區" oninput="calculate()">
      <div id="travelNotice" class="travel-notice"></div>
    </div>

    <div id="travelFeeGroup" class="form-group" style="display: none;">
      <label>跨區/偏遠差旅費 (元)</label>
      <input type="number" id="travelFeeInput" value="1000" oninput="calculate()">
    </div>

    <div class="row">
      <div class="form-group">
        <label>背板總寬度 (cm)</label>
        <input type="number" id="width" value="350" oninput="calculate()">
      </div>
      <div class="form-group">
        <label>背板總高度 (cm)</label>
        <input type="number" id="height" value="220" oninput="calculate()">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>貼紙材質</label>
        <select id="sticker" onchange="calculate()">
          <option value="oil">油性白背膠霧膜</option>
          <option value="milk">乳性白背膠霧膜</option>
        </select>
      </div>
      <div class="form-group">
        <label>板材材質</label>
        <select id="board" onchange="calculate()">
          <option value="std">5MM高優質合成板</option>
          <option value="h300">5MM 300CM合成板</option>
          <option value="gloss">5MM亮面合成板</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>鐵腳架規格</label>
      <select id="stand" onchange="calculate()">
        <option value="auto">自動依高度匹配</option>
        <option value="150">150CM 鐵腳架</option>
        <option value="180">180CM 鐵腳架</option>
        <option value="225">225CM 鐵腳架</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>📋 報價明細</h2>
    <table>
      <thead>
        <tr>
          <th>項目</th>
          <th class="text-center">數量/才</th>
          <th class="text-right">小計</th>
        </tr>
      </thead>
      <tbody id="detailTable"></tbody>
    </table>

    <div class="total-box">
      <div class="total-row"><span>未稅總價：</span><span id="subtotal" style="color:#fff;">$0</span></div>
      <div class="total-row"><span>營業稅 (5%)：</span><span id="tax" style="color:#fff;">$0</span></div>
      <div class="total-row grand-total"><span>含稅總價：</span><span id="grandTotal">$0</span></div>
    </div>
  </div>

  <button class="btn btn-secondary" onclick="openPasswordModal()">⚙️ 開啟後台：單價設定與管理</button>
</div>

<!-- 密碼輸入彈窗 -->
<div id="passwordModal" class="modal">
  <div class="modal-content pwd-card">
    <h2>🔒 管理員身分驗證</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">請輸入 4 位數管理員密碼：</p>
    <div class="form-group">
      <input type="password" id="adminPwdInput" placeholder="請輸入密碼" style="text-align: center; font-size: 1.2rem; letter-spacing: 4px;" maxlength="10">
    </div>
    <button class="btn btn-primary" onclick="verifyPassword()">解鎖進入後台</button>
    <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
  </div>
</div>

<!-- 後台管理彈窗 -->
<div id="adminModal" class="modal">
  <div class="modal-content">
    <h2>⚙️ 後台單價與參數管理</h2>
    <p style="font-size: 0.8rem; color: var(--text-muted);">可自訂現金與 4 種會員等級單價，修改後將自動保存於離線記憶庫中。</p>
    
    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>項目</th>
            <th>現金</th>
            <th>五千</th>
            <th>三萬A</th>
            <th>三萬B</th>
            <th>十萬</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>

    <div style="margin-top: 18px; display: flex; gap: 8px;">
      <button class="btn btn-primary" onclick="saveAdminRates()">💾 儲存並更新價格</button>
      <button class="btn btn-danger" onclick="resetDefaultRates()">🔄 恢復預設</button>
      <button class="btn btn-secondary" onclick="closeAdminModal()">關閉</button>
    </div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "5566";

const DEFAULT_RATES = {
  sticker: {
    oil:  { cash: 16.0, m5k: 15.9, m30k_1: 15.7, m30k_2: 15.5, m100k: 15.0, waste: { cash: 15.0, m5k: 14.9, m30k_1: 14.7, m30k_2: 14.5, m100k: 14.0 } },
    milk: { cash: 23.0, m5k: 22.0, m30k_1: 19.3, m30k_2: 18.9, m100k: 18.4, waste: { cash: 22.0, m5k: 21.0, m30k_1: 18.3, m30k_2: 17.9, m100k: 17.4 } }
  },
  board: {
    std:   { cash: 14.0, m5k: 12.0, m30k_1: 12.0, m30k_2: 12.0, m100k: 12.0 },
    h300:  { cash: 16.0, m5k: 14.0, m30k_1: 14.0, m30k_2: 14.0, m100k: 14.0 },
    gloss: { cash: 19.0, m5k: 18.0, m30k_1: 18.0, m30k_2: 18.0, m100k: 18.0 }
  },
  stand: {
    150: { cash: 170, m5k: 160, m30k_1: 160, m30k_2: 160, m100k: 160 },
    180: { cash: 205, m5k: 195, m30k_1: 195, m30k_2: 195, m100k: 195 },
    225: { cash: 250, m5k: 240, m30k_1: 240, m30k_2: 240, m100k: 240 }
  },
  installUnit: { cash: 15, m5k: 14, m30k_1: 14, m30k_2: 14, m100k: 14 },
  installBase: { cash: 1800, m5k: 1800, m30k_1: 1800, m30k_2: 1800, m100k: 1800 },
  removeUnit:  { cash: 10, m5k: 10, m30k_1: 10, m30k_2: 10, m100k: 10 },
  removeBase:  { cash: 1200, m5k: 1000, m30k_1: 1000, m30k_2: 1000, m100k: 1000 },
  trash:       { cash: 8, m5k: 6, m30k_1: 6, m30k_2: 6, m100k: 6 }
};

let RATES = JSON.parse(localStorage.getItem('CUSTOM_RATES')) || JSON.parse(JSON.stringify(DEFAULT_RATES));

const FREE_ZONES = ["台北市", "臺北市", "板橋", "三重", "中和", "永和", "新莊", "新店", "土城", "蘆洲", "樹林", "汐止", "泰山", "五股", "淡水", "八里"];

function getNestedValue(obj, path) {
  return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined) ? acc[key] : 0, obj);
}

function setNestedValue(obj, path, value) {
  const keys = path.split('.');
  let current = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (!current[keys[i]]) current[keys[i]] = {};
    current = current[keys[i]];
  }
  current[keys[keys.length - 1]] = value;
}

function checkTravelFee(address) {
  if (!address.trim()) return { hasFee: false, message: '', show: false };
  const isFree = FREE_ZONES.some(zone => address.includes(zone));
  return isFree 
    ? { hasFee: false, message: '✅ 雙北核心服務區（免加收偏遠/跨區差旅費）', show: true, isNoticeFree: true }
    : { hasFee: true, message: '⚠️ 超出台北市/新北市核心區（需加收跨區/偏遠差旅費）', show: true, isNoticeFree: false };
}

function calculate() {
  const tier = document.getElementById('tier').value;
  const width = parseFloat(document.getElementById('width').value) || 0;
  const height = parseFloat(document.getElementById('height').value) || 0;
  const address = document.getElementById('address').value;
  
  const stickerType = document.getElementById('sticker').value;
  const boardType = document.getElementById('board').value;
  const standOpt = document.getElementById('stand').value;

  const travelCheck = checkTravelFee(address);
  const noticeDiv = document.getElementById('travelNotice');
  const travelFeeGroup = document.getElementById('travelFeeGroup');

  let travelFee = 0;
  if (travelCheck.show) {
    noticeDiv.style.display = 'block';
    noticeDiv.innerText = travelCheck.message;
    if (travelCheck.isNoticeFree) {
      noticeDiv.className = 'travel-notice notice-free';
      travelFeeGroup.style.display = 'none';
    } else {
      noticeDiv.className = 'travel-notice notice-charge';
      travelFeeGroup.style.display = 'block';
      travelFee = parseFloat(document.getElementById('travelFeeInput').value) || 0;
    }
  } else {
    noticeDiv.style.display = 'none';
    travelFeeGroup.style.display = 'none';
  }

  const sqft = Math.ceil((width * height) / 900);
  const segments = Math.ceil(width / 120);

  // 損耗計算條件邏輯
  const tailWidth = width - (120 * (segments - 1));
  let wasteSqft = 0;
  
  if (stickerType === 'oil') {
    // 油性：總段數達 3 段以上才計算損耗
    if (segments >= 3 && tailWidth < 110 && width > 0) {
      wasteSqft = (segments * 120 * height / 900) - sqft;
    }
  } else if (stickerType === 'milk') {
    // 乳性：每段耗損 110cm 以內才算損耗
    if (tailWidth < 110 && width > 0) {
      wasteSqft = (segments * 120 * height / 900) - sqft;
    }
  }

  let standSize = standOpt;
  if (standOpt === 'auto') {
    if (height <= 165) standSize = '150';
    else if (height <= 202.5) standSize = '180';
    else standSize = '225';
  }

  const stickerPrice = getNestedValue(RATES, `sticker.${stickerType}.${tier}`);
  const stickerCost = Math.max(sqft * stickerPrice, 99);

  const boardPrice = getNestedValue(RATES, `board.${boardType}.${tier}`);
  const boardCost = sqft * boardPrice;

  const wastePrice = getNestedValue(RATES, `sticker.${stickerType}.waste.${tier}`);
  const wasteCost = wasteSqft * wastePrice;

  const standPrice = getNestedValue(RATES, `stand.${standSize}.${tier}`);
  const standCost = segments * standPrice;

  const installUnitPrice = getNestedValue(RATES, `installUnit.${tier}`);
  const installBase = getNestedValue(RATES, `installBase.${tier}`);
  const installCost = Math.max(sqft * installUnitPrice, installBase);

  const removeUnitPrice = getNestedValue(RATES, `removeUnit.${tier}`);
  const removeBase = getNestedValue(RATES, `removeBase.${tier}`);
  const removeCost = Math.max(sqft * removeUnitPrice, removeBase);

  const trashPrice = getNestedValue(RATES, `trash.${tier}`);
  const trashCost = sqft * trashPrice;

  const items = [
    { name: '貼紙印製', qty: `${sqft} 才`, cost: stickerCost },
    { name: '板材費用', qty: `${sqft} 才`, cost: boardCost },
    { name: '貼紙損耗費', qty: `${wasteSqft.toFixed(1)} 才`, cost: wasteCost },
    { name: `L型鐵腳架 (${standSize}cm)`, qty: `${segments} 個`, cost: standCost },
    { name: '現場施工費', qty: '1 式', cost: installCost },
    { name: '現場撤場費', qty: '1 式', cost: removeCost },
    { name: '廢棄物清運費', qty: `${sqft} 才`, cost: trashCost }
  ];

  if (travelCheck.hasFee && travelFee > 0) {
    items.push({ name: '跨區/偏遠施工差旅費', qty: '1 式', cost: travelFee });
  }

  const tbody = document.getElementById('detailTable');
  tbody.innerHTML = '';
  let subtotal = 0;

  items.forEach(item => {
    subtotal += item.cost;
    tbody.innerHTML += `
      <tr>
        <td>${item.name}</td>
        <td class="text-center">${item.qty}</td>
        <td class="text-right">$${Math.round(item.cost).toLocaleString()}</td>
      </tr>
    `;
  });

  const tax = Math.round(subtotal * 0.05);
  const grandTotal = subtotal + tax;

  document.getElementById('subtotal').innerText = `$${Math.round(subtotal).toLocaleString()}`;
  document.getElementById('tax').innerText = `$${tax.toLocaleString()}`;
  document.getElementById('grandTotal').innerText = `$${grandTotal.toLocaleString()}`;
}

// --- 身分驗證邏輯 ---
function openPasswordModal() {
  document.getElementById('adminPwdInput').value = '';
  document.getElementById('passwordModal').style.display = 'flex';
}

function closePasswordModal() {
  document.getElementById('passwordModal').style.display = 'none';
}

function verifyPassword() {
  const pwd = document.getElementById('adminPwdInput').value.trim();
  if (pwd === ADMIN_PASSWORD) {
    closePasswordModal();
    openAdminModal();
  } else {
    alert("❌ 密碼錯誤！請輸入 5566");
  }
}

// --- 後台管理邏輯 ---
function openAdminModal() {
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '';

  const createRow = (label, path) => {
    const tiers = ['cash', 'm5k', 'm30k_1', 'm30k_2', 'm100k'];
    let html = `<tr><td><strong>${label}</strong></td>`;
    tiers.forEach(t => {
      let val = getNestedValue(RATES, `${path}.${t}`);
      html += `<td><input type="number" step="0.1" data-path="${path}.${t}" value="${val}"></td>`;
    });
    html += '</tr>';
    return html;
  };

  let rows = '';
  rows += createRow('油性白背膠/才', 'sticker.oil');
  rows += createRow('油性損耗單價/才', 'sticker.oil.waste');
  rows += createRow('乳性白背膠/才', 'sticker.milk');
  rows += createRow('乳性損耗單價/才', 'sticker.milk.waste');
  rows += createRow('5mm高優質合成板', 'board.std');
  rows += createRow('5mm 300cm合成板', 'board.h300');
  rows += createRow('5mm亮面合成板', 'board.gloss');
  rows += createRow('150cm 鐵腳架/個', 'stand.150');
  rows += createRow('180cm 鐵腳架/個', 'stand.180');
  rows += createRow('225cm 鐵腳架/個', 'stand.225');
  rows += createRow('施工費單價/才', 'installUnit');
  rows += createRow('施工費基本價', 'installBase');
  rows += createRow('撤場費單價/才', 'removeUnit');
  rows += createRow('撤場費基本價', 'removeBase');
  rows += createRow('廢棄物清運/才', 'trash');

  tbody.innerHTML = rows;
  document.getElementById('adminModal').style.display = 'flex';
}

function closeAdminModal() {
  document.getElementById('adminModal').style.display = 'none';
}

function saveAdminRates() {
  const inputs = document.querySelectorAll('#adminTableBody input');
  inputs.forEach(input => {
    const path = input.dataset.path;
    const val = parseFloat(input.value) || 0;
    setNestedValue(RATES, path, val);
  });

  localStorage.setItem('CUSTOM_RATES', JSON.stringify(RATES));
  alert('✅ 單價設定已成功儲存！');
  closeAdminModal();
  calculate();
}

function resetDefaultRates() {
  if (confirm('確定要恢復預設單價嗎？自訂單價將被清空並載入最新預設價格。')) {
    RATES = JSON.parse(JSON.stringify(DEFAULT_RATES));
    localStorage.removeItem('CUSTOM_RATES');
    alert('已成功恢復最新的預設單價！');
    closeAdminModal();
    calculate();
  }
}

calculate();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installApp');
  btn.style.display = 'block';
  btn.addEventListener('click', () => {
    btn.style.display = 'none';
    deferredPrompt.prompt();
  });
});
</script>
</body>
</html>
